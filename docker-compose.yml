services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_CORS_ORIGIN: ${DB_CORS_ORIGIN}
      DB_API_KEY: ${DB_API_KEY}
      DB_REQUIRE_AUTH: ${DB_REQUIRE_AUTH}
      DB_OWNER_ID: ${DB_OWNER_ID}
      MODEL_PROVIDER: ${MODEL_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      DATABASE_URL: postgresql://db:${POSTGRES_PASSWORD}@db:5432/db
    ports:
      - "8080:8080"

volumes:
  db_data:
